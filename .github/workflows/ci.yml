name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: 后端接口自检
        # 自己起临时进程、用临时库，跑完就删。覆盖注册登录、鉴权、首次推送、
        # 增量游标、冲突判定、历史留档、登出失效、改密码、脏数据兜底，共 44 项。
        run: npm run check:server
