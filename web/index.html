<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>NiceNotes — 写一句，它会在你快忘记时回来找你</title>
    <meta
      name="description"
      content="NiceNotes 是一款按遗忘曲线自己复习的笔记工具。打开就是一条笔记，三个按钮决定它什么时候再出现。默认只存在本地，登录后可多设备同步。"
    />
    <meta name="theme-color" content="#F7F4EE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14130F" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NiceNotes — 会自己复习的笔记" />
    <meta property="og:description" content="写一句话就够。它会在你快忘记的时候，自己回来找你一次。" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NiceNotes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <style>
      html {
        background: #f7f4ee;
      }
      html[data-theme='dark'] {
        background: #14130f;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        font: 13px/1.6 -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: #9a9488;
        letter-spacing: 0.08em;
      }
    </style>
    <script>
      // 在样式生效前把主题定下来：否则深色模式会先闪一下浅色底
      (function () {
        try {
          var saved = localStorage.getItem('nicenotes.theme') || 'auto';
          var dark = saved === 'dark' || (saved === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (error) {
          /* 读不到就按浅色走 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">加载中</div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
